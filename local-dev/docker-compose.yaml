services:
  db:
    image: postgres:18.1
    container_name: store-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Named volume for persistent database data
      - postgres_data:/var/lib/postgresql
    restart: always

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: store-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIIO_PASSWORD}
    volumes:
      # Named volume for MinIO objects
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set store-minio http://minio:9000 pvpeev pvpeevpvpeev;
      /usr/bin/mc mb store-minio/product-thumbnails;
      /usr/bin/mc mb store-minio/product-images;
      /usr/bin/mc anonymous set download store-minio/product-thumbnails;
      /usr/bin/mc anonymous set download store-minio/product-images;
      exit 0;
      "
  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_HEAP_OPTS: "-Xmx2G -Xms2G"        # Give Kafka 2GB of RAM
      KAFKA_NUM_NETWORK_THREADS: 8            # More threads to handle network requests
      KAFKA_NUM_IO_THREADS: 16                # More threads to write to disk
      KAFKA_QUEUED_MAX_REQUESTS: 1000         # Allow more requests to wait in line
      KAFKA_SOCKET_RECEIVE_BUFFER_BYTES: 1048576
    volumes:
      - kafka_data:/var/lib/kafka/data
      - kafka_secrets:/etc/kafka/secrets
      - kafka_config:/mnt/shared/config
# Define the named volumes here
volumes:
  postgres_data:
  minio_data:
  kafka_data:
  kafka_secrets:
  kafka_config: