server:
  port: 8080

spring:
  application:
    name: store-application
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    drop-first: false
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 64
          max-idle: 20
          min-idle: 10
          max-wait: 1000ms
logging:
  level:
    org.springframework.jdbc.core: DEBUG
    org.springframework.jdbc.datasource: DEBUG


storage:
  s3:
    endpoint: "http://localhost:9000"
    region: "dummy" # MinIO doesn't care, but the SDK requires a value
    access-key: ${MINIIO_USER}
    secret-key: ${MINIIO_PASSWORD}
    path-style-access: true # Set to false when moving to AWS S3
